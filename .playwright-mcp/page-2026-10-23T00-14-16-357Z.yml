            - generic [ref=f8e389]:
              - heading [level=3] [ref=f8e390]:
                - button "¿Se puede pagar en cuotas?" [ref=f8e391]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f8e396]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f8e397]:
