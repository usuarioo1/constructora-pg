            - generic [ref=f8e364]:
              - heading [level=3] [ref=f8e365]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f8e366]
              - region "¿Hacen solo diseño o también construyen?" [ref=f8e370]:
                - paragraph [ref=f8e372]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f8e373]:
              - heading [level=3] [ref=f8e374]:
                - button "¿Cuánto demora cada obra?" [ref=f8e375]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f8e380]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f8e381]:
              - heading [level=3] [ref=f8e382]:
                - button "¿Cuánto cuesta?" [ref=f8e383]
              - region "¿Cuánto cuesta?":
