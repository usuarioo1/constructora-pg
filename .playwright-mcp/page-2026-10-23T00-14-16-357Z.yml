              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f8e404]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f8e405]:
              - heading [level=3] [ref=f8e406]:
                - button "¿Qué garantía tiene la obra?" [ref=f8e407]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f8e412]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f8e413]:
