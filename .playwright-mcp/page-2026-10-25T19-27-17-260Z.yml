            - generic [ref=f2e656]:
              - heading [level=3] [ref=f2e657]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f2e658]
              - region "¿Hacen solo diseño o también construyen?" [ref=f2e662]:
                - paragraph [ref=f2e664]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f2e665]:
              - heading [level=3] [ref=f2e666]:
                - button "¿Cuánto demora cada obra?" [ref=f2e667]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f2e672]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f2e673]:
              - heading [level=3] [ref=f2e674]:
                - button "¿Cuánto cuesta?" [ref=f2e675]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f2e680]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f2e681]:
              - heading [level=3] [ref=f2e682]:
                - button "¿Se puede pagar en cuotas?" [ref=f2e683]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f2e688]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f2e689]:
              - heading [level=3] [ref=f2e690]:
                - button "¿Se ocupan de los permisos?" [ref=f2e691]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f2e696]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f2e697]:
              - heading [level=3] [ref=f2e698]:
                - button "¿Qué garantía tiene la obra?" [ref=f2e699]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f2e704]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f2e705]:
              - heading [level=3] [ref=f2e706]:
                - button "¿A qué comunas llegan?" [ref=f2e707]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=f2e712]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
