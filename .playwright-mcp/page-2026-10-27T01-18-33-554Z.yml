          - generic [ref=e466]:
            - generic [ref=e467]:
              - heading [level=3] [ref=e468]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=e469]
              - region "¿Hacen solo diseño o también construyen?" [ref=e473]:
                - paragraph [ref=e475]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; luego cada foto de la galería quedará asociada a su proyecto y a su alcance.
            - generic [ref=e476]:
              - heading [level=3] [ref=e477]:
                - button "¿Cuánto demora cada obra?" [ref=e478]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=e483]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=e484]:
              - heading [level=3] [ref=e485]:
                - button "¿Cuánto cuesta?" [ref=e486]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=e491]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=e492]:
              - heading [level=3] [ref=e493]:
                - button "¿Se puede pagar en cuotas?" [ref=e494]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=e499]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=e500]:
              - heading [level=3] [ref=e501]:
                - button "¿Se ocupan de los permisos?" [ref=e502]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=e507]: "Cuando tu proyecto lo requiere, sí: gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso."
            - generic [ref=e508]:
              - heading [level=3] [ref=e509]:
                - button "¿Qué garantía tiene la obra?" [ref=e510]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=e515]: "En obras menores: 1 año. En las demás obras rige la garantía legal (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y si nos llamas después, seguimos respondiendo igual."
            - generic [ref=e516]:
              - heading [level=3] [ref=e517]:
                - button "¿A qué comunas llegan?" [ref=e518]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=e523]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
      - region [ref=e524]:
