            - generic [ref=f7e373]:
              - heading [level=3] [ref=f7e374]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f7e375]
              - region "¿Hacen solo diseño o también construyen?" [ref=f7e379]:
                - paragraph [ref=f7e381]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f7e382]:
              - heading [level=3] [ref=f7e383]:
                - button "¿Cuánto demora cada obra?" [ref=f7e384]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f7e389]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f7e390]:
              - heading [level=3] [ref=f7e391]:
                - button "¿Cuánto cuesta?" [ref=f7e392]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f7e397]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f7e398]:
              - heading [level=3] [ref=f7e399]:
                - button "¿Se puede pagar en cuotas?" [ref=f7e400]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f7e405]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f7e406]:
              - heading [level=3] [ref=f7e407]:
                - button "¿Se ocupan de los permisos?" [ref=f7e408]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f7e413]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f7e414]:
              - heading [level=3] [ref=f7e415]:
                - button "¿Qué garantía tiene la obra?" [ref=f7e416]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f7e421]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f7e422]:
              - heading [level=3] [ref=f7e423]:
                - button "¿A qué comunas llegan?" [ref=f7e424]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=f7e429]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
