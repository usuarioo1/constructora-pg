              - region "¿Hacen solo diseño o también construyen?" [ref=f5e370]:
                - paragraph [ref=f5e372]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
