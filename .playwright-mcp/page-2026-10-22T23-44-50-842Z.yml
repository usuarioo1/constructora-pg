              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f5e380]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f5e381]:
              - heading [level=3] [ref=f5e382]:
