            - generic [ref=f10e389]:
              - heading [level=3] [ref=f10e390]:
                - button "¿Se puede pagar en cuotas?" [ref=f10e391]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f10e396]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f10e397]:
