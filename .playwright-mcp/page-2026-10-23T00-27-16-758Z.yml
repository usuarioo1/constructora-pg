            - generic [ref=f10e364]:
              - heading [level=3] [ref=f10e365]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f10e366]
              - region "¿Hacen solo diseño o también construyen?" [ref=f10e370]:
                - paragraph [ref=f10e372]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f10e373]:
              - heading [level=3] [ref=f10e374]:
                - button "¿Cuánto demora cada obra?" [ref=f10e375]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f10e380]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f10e381]:
              - heading [level=3] [ref=f10e382]:
