            - generic [ref=f1e656]:
              - heading [level=3] [ref=f1e657]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f1e658]
              - region "¿Hacen solo diseño o también construyen?" [ref=f1e662]:
                - paragraph [ref=f1e664]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f1e665]:
              - heading [level=3] [ref=f1e666]:
                - button "¿Cuánto demora cada obra?" [ref=f1e667]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f1e672]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f1e673]:
              - heading [level=3] [ref=f1e674]:
                - button "¿Cuánto cuesta?" [ref=f1e675]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f1e680]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f1e681]:
              - heading [level=3] [ref=f1e682]:
                - button "¿Se puede pagar en cuotas?" [ref=f1e683]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f1e688]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f1e689]:
              - heading [level=3] [ref=f1e690]:
                - button "¿Se ocupan de los permisos?" [ref=f1e691]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f1e696]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f1e697]:
              - heading [level=3] [ref=f1e698]:
                - button "¿Qué garantía tiene la obra?" [ref=f1e699]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f1e704]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f1e705]:
              - heading [level=3] [ref=f1e706]:
                - button "¿A qué comunas llegan?" [ref=f1e707]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=f1e712]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
