              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f11e413]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f11e414]:
              - heading [level=3] [ref=f11e415]:
                - button "¿Qué garantía tiene la obra?" [ref=f11e416]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f11e421]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f11e422]:
