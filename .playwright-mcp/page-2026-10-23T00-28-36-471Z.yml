            - generic [ref=f11e373]:
              - heading [level=3] [ref=f11e374]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f11e375]
              - region "¿Hacen solo diseño o también construyen?" [ref=f11e379]:
                - paragraph [ref=f11e381]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f11e382]:
              - heading [level=3] [ref=f11e383]:
                - button "¿Cuánto demora cada obra?" [ref=f11e384]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f11e389]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f11e390]:
              - heading [level=3] [ref=f11e391]:
                - button "¿Cuánto cuesta?" [ref=f11e392]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f11e397]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f11e398]:
              - heading [level=3] [ref=f11e399]:
                - button "¿Se puede pagar en cuotas?" [ref=f11e400]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f11e405]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f11e406]:
