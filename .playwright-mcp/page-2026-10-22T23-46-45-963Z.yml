              - region "¿Hacen solo diseño o también construyen?" [ref=f6e354]:
                - paragraph [ref=f6e356]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
