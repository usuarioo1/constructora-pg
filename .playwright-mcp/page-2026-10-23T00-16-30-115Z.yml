                - button "¿A qué comunas llegan?" [ref=f9e415]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=f9e420]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
