            - generic [ref=f9e364]:
              - heading [level=3] [ref=f9e365]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f9e366]
              - region "¿Hacen solo diseño o también construyen?" [ref=f9e370]:
                - paragraph [ref=f9e372]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f9e373]:
              - heading [level=3] [ref=f9e374]:
                - button "¿Cuánto demora cada obra?" [ref=f9e375]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f9e380]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f9e381]:
              - heading [level=3] [ref=f9e382]:
                - button "¿Cuánto cuesta?" [ref=f9e383]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f9e388]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f9e389]:
              - heading [level=3] [ref=f9e390]:
                - button "¿Se puede pagar en cuotas?" [ref=f9e391]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f9e396]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f9e397]:
              - heading [level=3] [ref=f9e398]:
                - button "¿Se ocupan de los permisos?" [ref=f9e399]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f9e404]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f9e405]:
              - heading [level=3] [ref=f9e406]:
                - button "¿Qué garantía tiene la obra?" [ref=f9e407]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f9e412]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f9e413]:
