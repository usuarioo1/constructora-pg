          - generic [ref=f3e646]:
            - generic [ref=f3e647]:
              - heading [level=3] [ref=f3e648]:
                - button "¿Hacen solo diseño o también construyen?" [expanded] [ref=f3e649]
              - region "¿Hacen solo diseño o también construyen?" [ref=f3e653]:
                - paragraph [ref=f3e655]: Ambos. La mayoría de los proyectos integran diseño y obra bajo el mismo equipo; en otros desarrollamos el proyecto de arquitectura y el mandante construye con su propia constructora. En cada proyecto del portafolio se indica el alcance real.
            - generic [ref=f3e656]:
              - heading [level=3] [ref=f3e657]:
                - button "¿Cuánto demora cada obra?" [ref=f3e658]
              - region "¿Cuánto demora cada obra?":
                - paragraph [ref=f3e663]: "Quinchos 6–12 semanas; cocinas 6–10; remodelaciones 8–20; casas 12–18 meses. El permiso municipal es variable: en el mejor caso parte a los 3 meses."
            - generic [ref=f3e664]:
              - heading [level=3] [ref=f3e665]:
                - button "¿Cuánto cuesta?" [ref=f3e666]
              - region "¿Cuánto cuesta?":
                - paragraph [ref=f3e671]: Publicamos los precios de referencia en UF más arriba; el valor final se fija en la cotización sobre los antecedentes de tu proyecto.
            - generic [ref=f3e672]:
              - heading [level=3] [ref=f3e673]:
                - button "¿Se puede pagar en cuotas?" [ref=f3e674]
              - region "¿Se puede pagar en cuotas?":
                - paragraph [ref=f3e679]: Sí. Todos los proyectos se pueden pagar en cuotas con Transbank, desde la cotización.
            - generic [ref=f3e680]:
              - heading [level=3] [ref=f3e681]:
                - button "¿Se ocupan de los permisos?" [ref=f3e682]
              - region "¿Se ocupan de los permisos?":
                - paragraph [ref=f3e687]: Sí, gestionamos el permiso municipal completo. El trámite se cobra aparte, con un mínimo desde 30 UF por proceso.
            - generic [ref=f3e688]:
              - heading [level=3] [ref=f3e689]:
                - button "¿Qué garantía tiene la obra?" [ref=f3e690]
              - region "¿Qué garantía tiene la obra?":
                - paragraph [ref=f3e695]: "Por ley (Art. 18 LGUC): 3 años en terminaciones, 5 en instalaciones y 10 en estructura. Y nuestro compromiso no termina ahí: si nos llamas después de los 3 años, respondemos igual."
            - generic [ref=f3e696]:
              - heading [level=3] [ref=f3e697]:
                - button "¿A qué comunas llegan?" [ref=f3e698]
              - region "¿A qué comunas llegan?":
                - paragraph [ref=f3e703]: Todo Santiago según tu proyecto. Nos especializamos en Vitacura, Las Condes, La Reina, Lo Barnechea y Chicureo, más el sector poniente (Lampa, Ciudad de los Valles, Padre Hurtado).
